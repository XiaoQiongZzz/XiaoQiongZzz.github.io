<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我爱你</title>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    .img-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .img-text {
      position: absolute;
      top: 20px;
      left: 50px;
      color: rgb(234, 15, 15);
      font-size: 24px;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.516);
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      position: relative;
      z-index: 1;
      color: white;
      text-align: center;
      padding-top: 20px;
    }
  </style>
</head>
<body>
  <div class="img-container">
    <img src="C:\Users\XiaoQiong\Desktop\123.png" alt="我们的美好瞬间">
    <div class="img-text">你失约的海，我一个人去看了</div>
  </div>
  <h1>我永远都在你身边等你</h1>

  
  <audio id="myAudio" src="C:\Users\XiaoQiong\Desktop\10月11日.MP3" loop controls>
    浏览器不支持音频播放
  </audio>

  <script>
   
    document.addEventListener('click', function() {
      const audio = document.getElementById('myAudio');
      if (audio.paused) {
        audio.play().catch(e => {
          console.log('播放需要用户交互，请点击音频控件播放', e);
        });
      }
    });
  </script>
</body>
</html>
